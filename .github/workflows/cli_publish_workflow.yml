name: Release CLI Binaries
on:
  push:
    tags:
      - 'deadrop@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override release tag (defaults to the dispatched ref, e.g. deadrop@0.3.0)'
        required: false

jobs:
  cli-compile-binaries:
    name: Compile binary (${{ matrix.bun-target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: macos-latest
            bun-target: bun-darwin-arm64
            artifact-name: deadrop-darwin-arm64
          - runner: macos-15-intel
            bun-target: bun-darwin-x64
            artifact-name: deadrop-darwin-x64
          - runner: ubuntu-latest
            bun-target: bun-linux-x64
            artifact-name: deadrop-linux-x64
          - runner: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
            artifact-name: deadrop-linux-arm64
          - runner: windows-latest
            bun-target: bun-windows-x64
            artifact-name: deadrop-windows-x64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compile binary
        shell: bash
        env:
          PEER_SERVER_URL: ${{ secrets.PEER_SERVER_URL }}
          DEADROP_API_URL: ${{ secrets.DEADROP_API_URL }}
          DEADROP_APP_URL: ${{ secrets.DEADROP_APP_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          cd cli
          pnpm install --frozen-lockfile
          (cd node_modules/bun && node install.js)
          pnpm compile
      - name: Rename binary
        shell: bash
        run: |
          cd cli/dist
          mv deadrop ${{ matrix.artifact-name }} 2>/dev/null || mv deadrop.exe ${{ matrix.artifact-name }}.exe 2>/dev/null || true
      # Bun appends the bundle after linking, which breaks the linker's ad-hoc
      # signature, and Apple Silicon SIGKILLs it at launch. Re-sign: Developer
      # ID + notarize when the Apple secrets exist, ad-hoc until then. Bun needs
      # JIT and runtime native loads (libsql) under the hardened runtime, hence
      # cli/entitlements.plist.
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          bin="cli/dist/${{ matrix.artifact-name }}"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple signing secrets, ad-hoc signing $bin"
            codesign --force --sign - "$bin"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime \
            --entitlements cli/entitlements.plist \
            --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$bin"

          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
      # Every release before this shipped a darwin binary macOS killed on
      # launch, so prove it starts before uploading.
      - name: Verify binary launches
        shell: bash
        run: |
          cd cli/dist
          f=$(ls ${{ matrix.artifact-name }}* | grep -v '\.sha256$')
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --verify --strict --verbose=2 "$f"; fi
          "./$f" --version
      - name: Generate checksum
        shell: bash
        run: |
          cd cli/dist
          f=$(ls ${{ matrix.artifact-name }}* | grep -v '\.sha256$')
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$f" > "$f.sha256"
          else
            shasum -a 256 "$f" > "$f.sha256"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: cli/dist/${{ matrix.artifact-name }}*
          retention-days: 1

  cli-release:
    name: Create GitHub Release
    needs: cli-compile-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist/
          merge-multiple: true
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          automatic_release_tag: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
