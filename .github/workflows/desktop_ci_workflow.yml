name: Desktop CI

on:
  push:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop_ci_workflow.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop_ci_workflow.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every branch runs via push; only run on pull_request for forks (which
    # can't fire push), so same-repo PRs don't run twice.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri names bundles from tauri.conf.json, not package.json, so drift
      # here ships assets labelled with the wrong version.
      - name: Check desktop version sync
        run: pnpm -F desktop sync-version --check

      - name: Install deadrop
        run: npm install -g deadrop

      # Prod values come from the key's vault env. --no-sync: the CI token
      # is read-only and replication writes.
      - name: Build desktop frontend
        env:
          DEADROP_API_KEY: ${{ secrets.DEADROP_API_KEY }}
          DEADROP_VAULT_KEY: ${{ secrets.DEADROP_VAULT_KEY }}
        run: deadrop inject --ci --no-sync -- pnpm -F desktop build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Check Rust shell
        working-directory: desktop/src-tauri
        run: cargo check

  # NOTE: full multi-platform bundling (macOS/Windows/Linux via
  # tauri-apps/tauri-action) is a release-time job, intentionally not part of
  # this fast PR check.
